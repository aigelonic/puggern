name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
  release-planning:
    name: Release planning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/release-please/package-lock.json
      - run: npm ci --prefix tests/release-please
      - name: Validate release planning with offline GitHub fixtures
        run: node --test tests/release-please/*.test.mjs
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  e2e-production:
    name: E2E production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build production image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: puggern:test
          cache-from: type=gha,scope=e2e-production
          cache-to: type=gha,mode=max,scope=e2e-production
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Start production container
        run: |
          docker run -d --name puggern-test -p 127.0.0.1:8080:8080 puggern:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz
      - name: Test production NGINX module loading and offline profiles
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:8080 npm run test:e2e -- tests/e2e/modules.spec.mjs tests/e2e/profiles.spec.mjs tests/e2e/service-worker.spec.mjs tests/e2e/production-update.spec.mjs
      - name: Clean up production container
        if: always()
        run: docker rm -f puggern-test || true
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [unit, release-planning, e2e, e2e-production]
    if: always()
    steps:
      - name: Require every test job to succeed
        run: |
          test "${{ needs.unit.result }}" = success
          test "${{ needs.release-planning.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.e2e-production.result }}" = success
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix tests/release-please --audit-level=moderate
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
