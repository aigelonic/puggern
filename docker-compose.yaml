services:
  web:
    build:
      context: .
    image: puggern:local
    ports:
      - "${PUGGERN_BIND_ADDRESS:-127.0.0.1}:${PUGGERN_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped